services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.41@sha256:6ae376fa144a2e2f0f86a1fb8e2bf465b9834d73731f090f50277857ab743d30
    restart: unless-stopped
    command: >
      sh -c '
        if [ ! -f /CLIProxyAPI/config.yaml ]; then
          if [ -f /CLIProxyAPI/config.example.yaml ]; then
            cp /CLIProxyAPI/config.example.yaml /CLIProxyAPI/config.yaml;
          fi;
        fi;
        # Replace example API keys with a generated random key if still present
        if grep -q "your-api-key-1" /CLIProxyAPI/config.yaml 2>/dev/null; then
          sed -i "s/your-api-key-1/$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)/g" /CLIProxyAPI/config.yaml;
          sed -i "s/your-api-key-2/$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)/g" /CLIProxyAPI/config.yaml;
          sed -i "s/your-api-key-3/$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)/g" /CLIProxyAPI/config.yaml;
        fi;
        exec ./CLIProxyAPI
      '
    expose:
      - 8317
    volumes:
      - cliproxyapi-auths:/root/.cli-proxy-api
      - cliproxyapi-logs:/CLIProxyAPI/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8317 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  cliproxyapi-auths: {}
  cliproxyapi-logs: {}
