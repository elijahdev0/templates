[variables]
main_domain = "${domain}"
api_domain = "${domain}"

[config]

[[config.domains]]
serviceName = "hermes"
port = 9119
host = "${main_domain}"

[[config.domains]]
serviceName = "hermes"
port = 8642
host = "${api_domain}"

[config.env]
HERMES_ALLOW_ROOT_GATEWAY = "1"
HERMES_YOLO_MODE = "1"
HERMES_APPROVALS_MODE = "off"
HERMES_DASHBOARD = "1"
HERMES_DASHBOARD_HOST = "0.0.0.0"
API_SERVER_ENABLED = "true"
API_SERVER_HOST = "0.0.0.0"
API_SERVER_KEY = "${password:64}"
HERMES_DASHBOARD_BASIC_AUTH_USERNAME = "admin"
HERMES_DASHBOARD_BASIC_AUTH_PASSWORD = "${password:32}"
HERMES_DASHBOARD_BASIC_AUTH_SECRET = "${password:64}"
